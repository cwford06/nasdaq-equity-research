[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eqresearch"
version = "0.1.0"
description = "ML equity research on Nasdaq stocks: revenue-growth, margin-expansion and valuation screens, 12-month price targets, walk-forward backtest."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "pyarrow>=14",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
eqr = "eqresearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eqresearch = ["nasdaq100_fallback.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
